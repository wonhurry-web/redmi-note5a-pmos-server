# 默认入口：樱花FRP 隧道流量经本机 5436 进入 nginx，再反代到 daidai-panel。
# 面板是 SPA + SSE 日志流，反代必须关闭 proxy_buffering，否则日志不实时。
server {
    listen 80;
    server_name _;

    # 健康检查：验证隧道/反代是否打通（保留原验证页）
    location = /healthz {
        default_type text/html;
        return 200 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>pmos proxy</title></head><body style="font-family:monospace;background:#111;color:#0f0;padding:2rem"><h1>nginx proxy is alive</h1><p>Redmi Note 5A / postmarketOS headless server</p></body></html>';
    }

    # daidai-panel：根路径全量反代（Go 后端 5701 由面板容器内 Nginx 5700 代劳）
    location / {
        # 面板容器与 nginx 同在 dockersetup_proxy-net，用容器名解析（勿用 127.0.0.1，
        # 那指向 nginx 容器自身，到不了宿主机回环上的面板）
        proxy_pass http://daidai-panel:5700;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE（/api 日志流）关键：禁用缓冲 + 长超时，否则日志卡住不刷新
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # WebSocket（若面板用到）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
