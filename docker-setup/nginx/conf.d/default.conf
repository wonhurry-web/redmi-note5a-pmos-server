# 默认入口：验证隧道是否打通（访问隧道地址应看到这个页面）
server {
    listen 80;
    server_name _;

    location = / {
        default_type text/html;
        return 200 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>pmos proxy</title></head><body style="font-family:monospace;background:#111;color:#0f0;padding:2rem"><h1>nginx proxy is alive</h1><p>Redmi Note 5A / postmarketOS headless server</p><p>Reverse proxy skeleton is running. Add your services in conf.d.</p></body></html>';
    }

    # ---- 反代规则示例（取消注释并按需修改即可接入服务）----

    # 示例 1：把 /web/ 转发到本机 Docker 里的某个 Web 服务
    # location /web/ {
    #     proxy_pass http://127.0.0.1:3000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    # 示例 2：按路径转发到手机上另一个端口的服务
    # location /api/ {
    #     proxy_pass http://192.168.50.94:5000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    # 示例 3：用独立 server 块 + 域名分发（需在樱花FRP控制台绑定域名）
    # server {
    #     listen 80;
    #     server_name app.example.com;
    #     location / { proxy_pass http://127.0.0.1:8081; }
    # }
}
