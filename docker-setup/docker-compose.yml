services:
  # nginx 反向代理：把多个内部服务收敛到单一入口，由樱花FRP隧道对外暴露
  nginx:
    image: nginx:alpine
    container_name: pmos-nginx
    restart: unless-stopped
    ports:
      - "8080:80"      # 宿主机 8080 -> 容器 80（本机验证入口）
      # 樱花FRP 控制台把隧道 local_port 设为 5436，auto_https 解密后转发到此端口。
      # 让 5436 也落到 nginx，无需改控制台（若控制台 local_port 改成 8080 可删此行）。
      - "5436:80"
      # 一条隧道足够：nginx 按路径分流 /console → Halo、/ → 面板。
      # Halo console 用原生 /console/ 路径（router base 硬编码），无需独占端口。
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - proxy-net

  # 樱花FRP 客户端：用 -f <token>:<tunnel_id> 从控制台拉取隧道配置
  # 只需在 frpc/creds.env 填 TOKEN 和 TUNNEL_ID 即可，无需手写 frpc.toml
  # host 网络模式：让 frpc 能访问宿主机端口及同网段设备
  # 注意：natfrp/frpc 是精简镜像，无 /bin/sh，不能在容器内展开变量。
  # ${TOKEN}/${TUNNEL_ID} 由 compose 通过 --env-file ./frpc/creds.env 在宿主机侧展开。
  frpc:
    image: natfrp/frpc:latest
    container_name: pmos-frpc
    restart: unless-stopped
    network_mode: host
    command:
      - -f
      - "${TOKEN}:${TUNNEL_ID}"
      - -n

networks:
  proxy-net:
    driver: bridge
