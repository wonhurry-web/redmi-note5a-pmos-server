services:
  # nginx 反向代理：把多个内部服务收敛到单一入口，由樱花FRP隧道对外暴露
  nginx:
    image: nginx:alpine
    container_name: pmos-nginx
    restart: unless-stopped
    ports:
      - "8080:80"      # 宿主机 8080 -> 容器 80（隧道指向宿主机 8080）
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - proxy-net

  # 樱花FRP 客户端：用 -f <token>:<tunnel_id> 从控制台拉取隧道配置
  # 只需在 frpc/creds.env 填 TOKEN 和 TUNNEL_ID 即可，无需手写 frpc.toml
  # host 网络模式：让 frpc 能访问宿主机端口及同网段设备
  frpc:
    image: natfrp/frpc:latest
    container_name: pmos-frpc
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./frpc/creds.env
    entrypoint:
      - /bin/sh
      - -c
      - "exec frpc -f $$TOKEN:$$TUNNEL_ID -n"

networks:
  proxy-net:
    driver: bridge
