# 一条樱花FRP隧道(36004) -> 本机 5436 -> nginx 容器 80 -> daidai-panel（独占根路径）。
# 第二条隧道(36005) -> 本机 5437 -> nginx 容器 5437 -> Halo（独占根路径）。
#
# 为什么分成两个入口：Halo 2.x console 前端硬编码 createWebHistory("/console/")，
# 且前台首页也是根路径 /。面板同样是占根路径的 SPA。一个域名+端口下根路径只能给一个，
# 两个首页必然冲突（点主题预览/前台就跳到面板）。给 Halo 独立端口后，它独占根路径，
# 前台博客和后台 console 全部用原生路径，零 sub_filter、零路由错位。
#
# 访问来源协议判断：公网域名走樱花FRP 的 HTTPS 隧道，局域网 IP 直接 HTTP。
map $http_host $halo_scheme {
    default                           https;
    "~^192\.168\."                    http;
    "~^10\."                          http;
    "~^172\.(1[6-9]|2[0-9]|3[01])\."  http;
    "~^127\."                         http;
    "~^localhost"                     http;
}

# ============================================================
# 入口一：36004 -> 5436 -> 容器 80，daidai-panel 独占根路径
# ============================================================
server {
    listen 80;
    server_name _;

    client_max_body_size 1024m;

    location = /healthz {
        default_type text/html;
        return 200 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>pmos proxy</title></head><body style="font-family:monospace;background:#111;color:#0f0;padding:2rem"><h1>nginx proxy is alive</h1><p>Redmi Note 5A / postmarketOS headless server</p></body></html>';
    }

    location / {
        proxy_pass http://daidai-panel:5700;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ============================================================
# 入口二：36005 -> 5437 -> 容器 5437，Halo 独占根路径
# 标准反代，无需任何 sub_filter：console base /console/ 与地址栏一致。
# ============================================================
server {
    listen 5437;
    server_name _;

    client_max_body_size 1024m;

    location / {
        proxy_pass http://halo:8090;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $halo_scheme;

        # 局域网 HTTP 下隐藏上游 HSTS，防止浏览器把 IP 记住为强制 HTTPS
        proxy_hide_header Strict-Transport-Security;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
