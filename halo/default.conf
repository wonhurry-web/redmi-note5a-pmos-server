# 樱花FRP 隧道流量经本机 5436 进入 nginx，再按路径分流。
# - /halo/      -> Halo 博客（Java，对外占子路径）
# - /           -> daidai-panel（SPA + SSE 日志流，须关 proxy_buffering）

# 访问来源协议判断：公网域名走樱花FRP 的 HTTPS 隧道，局域网 IP 直接 HTTP。
# 该变量用于 X-Forwarded-Proto 与 proxy_redirect，避免局域网访问被 302 跳到不存在的 HTTPS。
map $http_host $halo_scheme {
    default                           https;
    "~^192\.168\."                    http;
    "~^10\."                          http;
    "~^172\.(1[6-9]|2[0-9]|3[01])\."  http;
    "~^127\."                         http;
    "~^localhost"                     http;
}

server {
    listen 80;
    server_name _;

    # 健康检查：验证隧道/反代是否打通
    location = /healthz {
        default_type text/html;
        return 200 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>pmos proxy</title></head><body style="font-family:monospace;background:#111;color:#0f0;padding:2rem"><h1>nginx proxy is alive</h1><p>Redmi Note 5A / postmarketOS headless server</p></body></html>';
    }

    # ---------- Halo 博客：/halo/ 子路径 ----------
    # proxy_pass 末尾带斜杠 -> /halo/xxx 剥离为 /xxx 转发给 Halo。
    # sub_filter 把 HTML/JS/CSS 里写死根路径的资源改为 /halo/ 前缀。
    # proxy_redirect 把 302 Location 改为子路径；负向 lookahead 防双前缀。
    # 禁用上游 gzip 让 sub_filter 生效；不碰 JSON 避免破坏 API 数据。
    location /halo/ {
        proxy_pass http://halo:8090/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $halo_scheme;
        proxy_set_header Accept-Encoding   "";

        # Halo 原始 Location 是根相对（如 /login）。replacement 若以 / 开头，
        # nginx 会用上游地址补全成绝对 URL（导致 127.0.0.1）。因此显式写绝对 URL：
        # $http_host 取浏览器真实域名；$halo_scheme 按来源选 http/https。
        proxy_redirect ~^/(?!halo/)(.*)$ $halo_scheme://$http_host/halo/$1;

        # 局域网 HTTP 下隐藏上游 HSTS，防止浏览器把 IP 记住为强制 HTTPS
        proxy_hide_header Strict-Transport-Security;

        sub_filter_once off;
        sub_filter_types text/css application/javascript;
        sub_filter 'src="/js/'       'src="/halo/js/';
        sub_filter 'src="/webjars/'  'src="/halo/webjars/';
        sub_filter 'href="/styles/'  'href="/halo/styles/';
        sub_filter 'href="/webjars/' 'href="/halo/webjars/';
        sub_filter 'href="/css/'     'href="/halo/css/';
        sub_filter 'src="/ui-assets/'  'src="/halo/ui-assets/';
        sub_filter 'href="/ui-assets/' 'href="/halo/ui-assets/';
        sub_filter '"/ui-assets/'      '"/halo/ui-assets/';
        sub_filter '"/api/'          '"/halo/api/';
        sub_filter '"/apis/'         '"/halo/apis/';
        sub_filter '"/upload/'       '"/halo/upload/';
        sub_filter '"/plugins/'      '"/halo/plugins/';

        # Halo 2.x 登录/初始化是服务端渲染表单，action 写死根路径（/login、/system/setup、
        # /password-reset/email）。不改写会 POST 到 location / 落到 daidai-panel → 405 Not Allowed。
        sub_filter 'action="/login"'          'action="/halo/login"';
        sub_filter 'action="/system/setup"'   'action="/halo/system/setup"';
        sub_filter 'action="/password-reset/' 'action="/halo/password-reset/';
        sub_filter 'src="/images/'            'src="/halo/images/';
        sub_filter 'href="/images/'           'href="/halo/images/';
        sub_filter 'href="/password-reset/'   'href="/halo/password-reset/';
        sub_filter 'href="/"'                 'href="/halo/"';

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /halo {
        return 302 /halo/;
    }

    # ---------- Halo console SPA 的 ui-assets 兜底 ----------
    # console 的 JS bundle 动态拼出绝对路径 /ui-assets/xxx，sub_filter 改不到，
    # 若落到 location / 会被 daidai-panel 返回 404，导致 console 一直加载。
    # 单独接住根路径 /ui-assets/ 并原样转发给 Halo（proxy_pass 不带斜杠，保留完整路径）。
    location /ui-assets/ {
        proxy_pass http://halo:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $halo_scheme;
        proxy_hide_header Strict-Transport-Security;
    }

    # ---------- daidai-panel：根路径 ----------
    location / {
        proxy_pass http://daidai-panel:5700;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ============================================================
# Halo 独立入口：listen 5437
# ------------------------------------------------------------
# 背景：Halo 2.x 的 console 前端硬编码 createWebHistory("/console/")，
# external-url 官方不支持带子路径。挂在 /halo/ 子路径下必然路由错位
# （/halo/console -> /console/halo/console -> 根路径 /dashboard）。
# 因此给 Halo 单独一个端口，让它独占根路径，用标准反代即可，无需 sub_filter。
# 樱花FRP 新隧道：https://<域名>:36005 -> 127.0.0.1:5437
# ============================================================
server {
    listen 5437;
    server_name _;

    client_max_body_size 1024m;

    location / {
        proxy_pass http://halo:8090;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Strict-Transport-Security;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
