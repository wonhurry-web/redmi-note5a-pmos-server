# 一条樱花FRP隧道 -> 本机 5436 -> nginx 容器 80 -> 按路径分流到两个上游。
#   /console, /apis/, /ui-assets/ ...  -> Halo(halo:8090)
#   /                                 -> daidai-panel(daidai-panel:5700)
#
# 为什么不再用 /halo/ 子路径：Halo 2.x console 前端硬编码 createWebHistory("/console/")，
# 挂在 /halo/console 下会让地址栏与 router base 错位（/console/halo/console -> /dashboard）。
# 改用它原生 /console/ 后，地址栏与 base 一致，无需任何 sub_filter 改写。
#
# 前缀不冲突：面板用 /api/(无 s)、/assets/、/fonts/；Halo 用 /apis/(有 s)、/ui-assets/ 等。
# 代价：根路径 / 归面板，Halo 前台首页让位（后台走 /console，本就够用）。

map $http_host $halo_scheme {
    default                           https;
    "~^192\.168\."                    http;
    "~^10\."                          http;
    "~^172\.(1[6-9]|2[0-9]|3[01])\."  http;
    "~^127\."                         http;
    "~^localhost"                     http;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1024m;

    # 健康检查：验证隧道/反代是否打通
    location = /healthz {
        default_type text/html;
        return 200 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>pmos proxy</title></head><body style="font-family:monospace;background:#111;color:#0f0;padding:2rem"><h1>nginx proxy is alive</h1><p>Redmi Note 5A / postmarketOS headless server</p></body></html>';
    }

    # ---------- Halo：原生路径，标准反代，无 sub_filter ----------
    # 覆盖：console SPA(/console/...)、API(/apis/)、console 静态块(/ui-assets/)、
    # actuator、服务端渲染表单页(/login、/system/setup、/password-reset/)、
    # 以及登录/初始化页依赖的静态资源(/images /js /styles /webjars /css /plugins /upload)。
    # proxy_pass 不带 URI -> 保留浏览器原始完整路径，Halo 后端原生识别。
    location ~ ^/(console|apis|ui-assets|actuator|images|js|styles|webjars|css|plugins|upload|system/setup|password-reset|login)(/|$) {
        proxy_pass http://halo:8090;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $halo_scheme;

        # 局域网 HTTP 下隐藏上游 HSTS，防止浏览器把 IP 记住为强制 HTTPS
        proxy_hide_header Strict-Transport-Security;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ---------- daidai-panel：根路径 ----------
    location / {
        proxy_pass http://daidai-panel:5700;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
